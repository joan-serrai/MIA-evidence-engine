# Minimal continuous integration: on every push / PR the PURE tests run
# (tests/test_pure.py). They need neither Ollama, nor the vector database, nor the
# embedding models, so torch/transformers (~2 GB) are NOT installed: only the
# dependencies imported by the tested modules, at the same pinned versions as in
# requirements.txt.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-dotenv==1.2.3" "chromadb==1.5.9" "ollama==0.6.2" \
                                "requests==2.34.2" pytest
      - name: Run pure tests
        run: python -m pytest -q
