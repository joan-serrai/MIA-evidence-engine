# MIA visual theme (Streamlit reads this file automatically at startup).
#
# "Aurora" palette: deep dark background with accents reminiscent of the northern
# lights, in the colours used in life sciences and health care (clinical teal, cyan,
# health green and a supporting violet).
#
# These values tint Streamlit's NATIVE widgets (buttons, inputs, sidebar). The
# soft "aurora" gradients themselves are painted with custom CSS in
# app/streamlit_app.py, because config.toml does not support gradients.
[theme]
base = "dark"
primaryColor = "#2fe0a8"              # bright teal-green: main accent
backgroundColor = "#070d14"           # near-black with a blue tint (night sky)
secondaryBackgroundColor = "#0e1723"  # raised surfaces (sidebar, blocks)
textColor = "#e8f1f5"                 # cold white, high contrast on the background
font = "sans serif"

[client]
# Hide the developer toolbar for a product-like look.
toolbarMode = "minimal"

[server]
# SECURITY: by default Streamlit listens on ALL interfaces (0.0.0.0) and prints a
# public "External URL". MIA is a LOCAL tool with no authentication, so it is bound
# to localhost and can only be opened from this computer. To share it on a trusted
# network, change this on purpose.
address = "localhost"

[browser]
# Streamlit sends usage telemetry to its servers by default. In a product that
# promises "no data leaves the computer", that is switched off.
gatherUsageStats = false
