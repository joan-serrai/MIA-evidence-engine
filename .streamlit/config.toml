# Tema visual de MIA (Streamlit lo lee automáticamente al arrancar la app).
# Paleta "Centivence": fondo claro, acento verde salvia, tinta casi negra.
[theme]
base = "light"
primaryColor = "#3f6e66"          # salvia Centivence — botones, foco, acentos
backgroundColor = "#FFFFFF"        # lienzo principal
secondaryBackgroundColor = "#FAFAFA"  # barra lateral y bloques
textColor = "#1A1A1A"              # tinta, alto contraste
font = "sans serif"

[client]
# Ocultamos la barra de herramientas de desarrollador para un look de producto.
toolbarMode = "minimal"
