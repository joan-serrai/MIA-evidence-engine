# Tema visual de MIA (Streamlit lo lee automáticamente al arrancar la app).
#
# Paleta "Aurora LSHC": fondo oscuro profundo con acentos que recuerdan a una
# aurora boreal, pero con los colores que se usan en Life Sciences & Health Care
# (verde-azulado clínico, cian, verde salud y un violeta de apoyo). El verde
# salvia original de Centivence sigue ahí, aclarado para que contraste sobre
# oscuro: en un fondo negro, el #3f6e66 original no se leería.
#
# Estos valores tiñen los widgets NATIVOS de Streamlit (botones, inputs,
# sidebar). El aspecto "aurora" en sí —los degradados difusos— se pinta con CSS
# propio en app/streamlit_app.py, porque config.toml no admite gradientes.
[theme]
base = "dark"
primaryColor = "#2fe0a8"              # verde-azulado brillante: acento principal
backgroundColor = "#070d14"           # casi negro con matiz azul (cielo nocturno)
secondaryBackgroundColor = "#0e1723"  # superficies elevadas (sidebar, bloques)
textColor = "#e8f1f5"                 # blanco frío, alto contraste sobre el fondo
font = "sans serif"

[client]
# Ocultamos la barra de herramientas de desarrollador para un look de producto.
toolbarMode = "minimal"

[server]
# SEGURIDAD (3-sep-2026): por defecto Streamlit escucha en TODAS las interfaces
# (0.0.0.0) y anuncia una "External URL" pública. MIA es una herramienta LOCAL
# sin autenticación: la atamos a localhost para que solo se pueda abrir desde
# este equipo. Para compartirla en una red de confianza, cambiar aquí a propósito.
address = "localhost"

[browser]
# Streamlit envía telemetría de uso a sus servidores por defecto. En un producto
# que promete "ningún dato sale del ordenador", eso se apaga.
gatherUsageStats = false
